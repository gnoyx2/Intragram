<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob:; font-src 'self' data:; worker-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; form-action 'none'; base-uri 'self'">
  <meta name="color-scheme" content="light dark">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Intragram 앱과 같은 화면에서 암호화 대화와 파일을 주고받으세요.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Intragram">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Intragram</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --canvas: #fff; --ink: #171c26; --muted: #3d495c; --accent: #2563eb; --track: #d6dee8; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --canvas: #0d0f14; --ink: #f1f5fc; --muted: #b6c2d2; --accent: #60a5fa; --track: #282e3d; }
    }
    :root[data-theme="dark"] { --canvas: #0d0f14; --ink: #f1f5fc; --muted: #b6c2d2; --accent: #60a5fa; --track: #282e3d; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    #app-loading { position: fixed; inset: 0; z-index: 10000; display: grid; place-content: center; justify-items: center; padding: 24px; background: var(--canvas); text-align: center; font: 16px/1.5 system-ui, sans-serif; }
    #app-loading img { width: 80px; height: 80px; }
    #app-loading h1 { margin: 16px 0 8px; font-size: 24px; font-weight: 650; letter-spacing: -.5px; }
    #app-loading p { margin: 0; color: var(--muted); }
    #app-loading a { color: var(--accent); }
    .loading-ring { width: 22px; height: 22px; margin-top: 24px; border: 3px solid var(--track); border-top-color: var(--accent); border-radius: 50%; animation: loading-turn 1s linear infinite; }
    @keyframes loading-turn { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) { .loading-ring { animation: none; } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite" aria-atomic="true">
    <img src="icons/Icon-192.png" width="80" height="80" alt="">
    <h1>Intragram</h1>
    <p><span lang="ko">앱을 여는 중입니다.</span><br><span lang="en">Starting the app.</span></p>
    <span class="loading-ring" aria-hidden="true"></span>
    <noscript><p>JavaScript를 켜 주세요. · Please enable JavaScript.</p></noscript>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
