name: release

# 버전 태그(예: v1.0.0)를 올리면 모든 플랫폼을 빌드해서 바이너리를 붙인 초안 GitHub Release를 엶.
# 빌드 잡마다 서명 상태를 측정해 SIGNING-<플랫폼>.txt를 Actions 산출물에 남김
#
# 플랫폼별 서명 (전체 절차는 RELEASING.md)
# - Android: ANDROID_KEYSTORE_* 시크릿이 있을 때만 릴리즈 키로 서명함. 없으면 APK가 debug 서명이라
#   *-debugsigned.apk로 이름을 바꿔 워크플로 실행 산출물로만 남기고(릴리즈엔 안 붙임) .aab도 안 만듦
# - iOS·macOS·Windows·Linux: 서명 자격 증명을 안 이어 둠. iOS는 서명 없음(--no-codesign), macOS는 ad-hoc 서명에
#   공증 없음, Windows는 Authenticode 서명 없음, Linux는 OS 수준 서명이 없음
#
# 첫 태그를 올리기 전에 Run workflow(workflow_dispatch)로 한 번 실행해 확인해야 함

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: python3 tool/check_loc.py
      - run: python3 tool/release_workflow_test.py
      - run: python3 tool/windows_installer_test.py
      - run: python3 tool/macos_dmg_test.py
      - run: flutter analyze
      # 'large' 태그(1GiB·4GiB 전송 회귀)는 느리고 디스크를 수 GiB 써서 릴리즈 게이트에서도 제외함 (필요하면 별도 실행함)
      - run: flutter test --exclude-tags large
      - run: node tool/browser_guard_test.js
      - run: node tool/web_design_test.js

  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # WebRTC 네이티브 라이브러리가 든 Android 빌드는 기본 러너의 여유 공간을 넘김: 안 쓰는 도구(.NET, GHC, Boost, CodeQL)를 지움
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Restore release keystore (only if the secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          rm -f android/key.properties "$RUNNER_TEMP/release.jks"
          if [ -z "$KEYSTORE_B64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "No release keystore secret: the build will be debug-signed."
            exit 0
          fi
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::All four Android signing secrets must be configured together."
              exit 1
            fi
          done
          umask 077
          python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode("".join(os.environ["KEYSTORE_B64"].split()), validate=True))' \
            > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > android/key.properties
      # 키가 없으면 Gradle이 release 빌드를 거부하므로 allowDebugSigning으로 debug 서명 APK 생성을 허용함.
      # 생성된 APK는 *-debugsigned로 이름을 바꾸고 릴리즈에는 절대 첨부하지 않음
      - run: flutter build apk --release
        env:
          ORG_GRADLE_PROJECT_allowDebugSigning: 'true'
      - name: Build app bundle only with a release key
        run: |
          if [ -f android/key.properties ]; then
            flutter build appbundle --release
          else
            echo "No release key: skipping the unused debug-signed app bundle."
          fi
      - name: Collect artifacts and measure signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rm -f dist/*.apk dist/*.aab dist/SIGNING-android.txt
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          if [ -f android/key.properties ]; then KEY=release; SUFFIX=""; else KEY=debug; SUFFIX="-debugsigned"; fi
          APK="dist/intragram-android${SUFFIX}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          if [ "$KEY" = release ]; then cp build/app/outputs/bundle/release/app-release.aab dist/intragram-android.aab; fi
          {
            echo "commit: $GITHUB_SHA"
            echo "flutter: $FLUTTER_VERSION, runner: ubuntu-24.04 x64"
            echo "android key: $KEY (debug means the public debug key: not for distribution)"
            echo "$(basename "$APK")"
            if ! certs=$("$APKSIGNER" verify --print-certs "$APK" 2>&1); then
              printf '%s\n' "$certs" >&2
              exit 1
            fi
            printf '%s\n' "$certs"
            if ! grep -q 'certificate DN:' <<< "$certs" ||
               ! grep -q 'certificate SHA-256 digest:' <<< "$certs"; then
              printf '%s\n' "$certs" >&2
              echo "::error::missing APK signer identity or digest for $APK" >&2
              exit 1
            fi
            if [ -f dist/intragram-android.aab ]; then
              echo "intragram-android.aab"
              keytool -J-Duser.language=en -J-Duser.country=US -printcert -jarfile dist/intragram-android.aab | grep -E 'Owner|SHA256'
            fi
          } > dist/SIGNING-android.txt
          cat dist/SIGNING-android.txt
          if [ "$KEY" = release ] && grep -q 'CN=Android Debug' dist/SIGNING-android.txt; then
            echo "::error::release key expected but a debug certificate was found"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build linux --release
      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf dist/intragram-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          {
            echo "commit: $GITHUB_SHA"
            echo "flutter: $FLUTTER_VERSION, runner: ubuntu-24.04 x64"
            echo "linux signing: none (no OS-level code signing; verify the GitHub asset digest)"
          } > dist/SIGNING-linux.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release
      # VC++ 런타임이 없는 PC에서도 뜨게 앱 폴더에 같이 넣음 (앱 로컬 배포)
      - name: Package portable zip
        shell: pwsh
        run: |
          $rel = 'build/windows/x64/runner/Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$dll" $rel
          }
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path "$rel/*" -DestinationPath dist/intragram-windows-x64-portable.zip
          $sig = Get-AuthenticodeSignature "$rel/intragram.exe"
          @(
            "commit: $env:GITHUB_SHA"
            "flutter: $env:FLUTTER_VERSION, runner: windows-2022 x64"
            "windows signing: Authenticode status $($sig.Status) (NotSigned means SmartScreen will warn)"
          ) | Set-Content dist/SIGNING-windows.txt
      # 설치형: 같은 Release 폴더(VC++ 런타임 포함)를 Inno Setup으로 묶음. 사용자 단위 설치라 관리자 권한 없이 깔림
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)').Matches[0].Groups
          & $iscc "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DAppVersion=$($v[1].Value)" `
            "/DFileVersion=$($v[1].Value).$($v[2].Value)" "/O$PWD\dist" windows\installer\intragram.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sig = Get-AuthenticodeSignature dist\intragram-windows-x64-setup.exe
          Add-Content dist/SIGNING-windows.txt "windows installer signing: Authenticode status $($sig.Status)"
      # 러너에 조용히 설치해 파일·시작 메뉴·앱 목록 항목을 보고, 깔린 앱을 띄운 뒤 제거까지 확인함
      - name: Test installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $quiet = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $setup = Start-Process "$PWD\dist\intragram-windows-x64-setup.exe" -ArgumentList $quiet -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "setup exited with $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Intragram"
          $link = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Intragram.lnk"
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{2EA84494-9B4A-48D2-93CC-3A08EED7E51A}_is1'
          foreach ($file in 'intragram.exe', 'flutter_windows.dll', 'vcruntime140.dll', 'data\app.so', 'unins000.exe') {
            if (-not (Test-Path "$app\$file")) { throw "installer did not place $file" }
          }
          if (-not (Test-Path $link)) { throw 'no Start menu shortcut' }
          if ((Get-ItemProperty $key).DisplayName -ne 'Intragram') { throw 'no Settings > Apps entry' }
          $run = Start-Process "$app\intragram.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($run.HasExited) { throw "installed app exited with $($run.ExitCode)" }
          Stop-Process -Id $run.Id -Force
          $run.WaitForExit(10000) | Out-Null
          Start-Process "$app\unins000.exe" -ArgumentList $quiet -Wait
          # 제거 프로그램은 임시 사본으로 다시 떠서 바로 끝나므로 다 지워질 때까지 기다림
          for ($i = 0; $i -lt 60 -and ((Test-Path "$app\intragram.exe") -or (Test-Path $key)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$app\intragram.exe") { throw 'uninstall left the app' }
          if (Test-Path $link) { throw 'uninstall left the Start menu shortcut' }
          if (Test-Path $key) { throw 'uninstall left the Settings > Apps entry' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*

  apple:
    needs: verify
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Show Apple SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile

      - name: Build macOS
        run: flutter build macos --release
      - name: Package macOS DMG
        run: |
          mkdir -p dist
          APP="build/macos/Build/Products/Release/Intragram.app"
          # 설치 창: 1x·2x 배경을 한 TIFF로 묶고, dmgbuild가 Applications 바로가기와 아이콘 자리를 .DS_Store에 직접 씀
          python3 -m venv "$RUNNER_TEMP/dmgenv"
          "$RUNNER_TEMP/dmgenv/bin/pip" install --quiet dmgbuild==1.6.7
          tiffutil -cathidpicheck macos/packaging/dmg-background.png macos/packaging/dmg-background@2x.png -out "$RUNNER_TEMP/dmg-background.tiff"
          "$RUNNER_TEMP/dmgenv/bin/dmgbuild" -s macos/packaging/dmg_settings.py \
            -D app="$APP" -D background="$RUNNER_TEMP/dmg-background.tiff" Intragram dist/intragram-macos.dmg
          {
            echo "commit: $GITHUB_SHA"
            echo "flutter: $FLUTTER_VERSION, runner: xcode-27, Xcode 27.1"
            echo "macOS app codesign (Signature=adhoc and no TeamIdentifier means not notarizable):"
            codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Signature|Authority|TeamIdentifier' || true
            echo "macOS entitlements (get-task-allow must not appear in a distribution build):"
            # 읽기에 실패하면 '없음'으로 적지 않고 잡을 실패시킴
            ENTITLEMENTS=$(codesign -d --entitlements - --xml "$APP")
            echo "$ENTITLEMENTS" | plutil -p - | grep -E 'get-task-allow|app-sandbox' || echo "  no get-task-allow; app-sandbox not listed"
            echo "macOS Gatekeeper assessment:"
            spctl --assess --type execute --verbose "$APP" 2>&1 || true
          } > dist/SIGNING-apple.txt

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa
        run: |
          APP_DIR="build/ios/iphoneos"
          mkdir -p Payload
          cp -R "$APP_DIR"/Runner.app Payload/
          zip -qr dist/intragram-ios-unsigned.ipa Payload
          rm -rf Payload
          {
            echo "iOS .ipa codesign (expect: code object is not signed at all):"
            codesign -dv "$APP_DIR"/Runner.app 2>&1 | head -3 || true
          } >> dist/SIGNING-apple.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple
          path: dist/*

  release:
    needs: [android, linux, windows, apple]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # 빌드 출처 증명(SLSA provenance)을 Sigstore로 서명해 올림
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          # 공개 다운로드용 빌드만 복사함. 디버그 APK, 미서명 IPA와 서명 보고서는 Actions에 남김.
          find artifacts -type f \( \
            -name intragram-android.apk -o -name intragram-android.aab -o \
            -name intragram-macos.dmg -o -name intragram-linux-x64.tar.gz -o \
            -name intragram-windows-x64-setup.exe -o -name intragram-windows-x64-portable.zip \
          \) -exec cp {} release/ \;
          ls -lh release
      # GitHub의 파일 체크섬과 별도로 이 워크플로가 만들었다는 증명을 남김
      # (gh attestation verify <file> --repo <owner>/Intragram). 공개 저장소에서만 됨
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: 'release/*'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
          # DEVICE_QA.md를 통과하고 관리자가 저장소 변수 DEVICE_QA_PASSED=true를 두기 전까진 늘 pre-release로 표시함
          prerelease: ${{ contains(github.ref_name, '-') || vars.DEVICE_QA_PASSED != 'true' }}
          body: |
            Intragram ${{ github.ref_name }}, a LAN-only P2P messenger.
            Source commit `${{ github.sha }}`, built with Flutter ${{ env.FLUTTER_VERSION }}.

            GitHub provides a SHA-256 digest beside each asset. To verify its build provenance,
            run `gh attestation verify <file> --repo ${{ github.repository }}`.

            Signing reports are available in the workflow-run artifacts.
            - Android: the APK and Google Play AAB use the release signing key.
            - iPhone, iPad and Mac: [App Store](https://apps.apple.com/kr/app/intragram/id6814277170).
            - macOS: on the [Mac App Store](https://apps.apple.com/kr/app/intragram/id6814277170), and also attached as `intragram-macos.dmg` (ad-hoc signed, not notarized; Gatekeeper will warn).
            - Windows installer (`-setup.exe`: installs for the current user without admin rights,
              remove it in Settings > Apps) and portable zip (`-portable.zip`): not Authenticode-signed. SmartScreen will warn.
            - Linux tarball: experimental, Linux runtime/dependencies not yet reviewed; no OS-level signing.

            Licenses are bundled in the app under Settings › Open-source licenses and available in the source:
            [MIT](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/LICENSE),
            [third-party notices](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/THIRD_PARTY_NOTICES.md),
            [WebRTC notices](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/assets/licenses/WEBRTC_NOTICES.md).

            Real-device test status and open items are in `README.md` (Status) and
            `DEVICE_QA.md`. Review the signing reports and device QA before publishing
            or installing these builds.
